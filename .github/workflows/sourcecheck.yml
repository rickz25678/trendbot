name: sourcecheck
# manual test: does every information source work from GitHub's servers?
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_sources.mjs
        env:
          TG_CHANNELS: ${{ vars.TG_CHANNELS || '' }}
