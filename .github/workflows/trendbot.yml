name: trendbot
on:
  schedule:
    - cron: '*/5 * * * *'   # backup only - GitHub often skips these; runs chain themselves below
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: trendbot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: queue the next run (starts the moment this one finishes)
        # To stop the bot: set repo variable STOP = 1
        if: vars.STOP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run trendbot.yml -R ${{ github.repository }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot.mjs
        timeout-minutes: 9
        env:
          LOOP_MS: '270000'   # keep checking every minute for ~4.5 min
          TG_CHANNELS: ${{ vars.TG_CHANNELS || 'WatcherGuru' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save state
        if: always()
        run: |
          git config user.name trendbot
          git config user.email trendbot@users.noreply.github.com
          git add -f state library.json
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
