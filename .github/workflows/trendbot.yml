name: trendbot
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may delay a few minutes at busy times)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trendbot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save state
        if: always()
        run: |
          git config user.name trendbot
          git config user.email trendbot@users.noreply.github.com
          git add -f state
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
